name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.1). Leave empty for auto-bump."
        required: false
        default: ""
        type: string
      platforms:
        description: "Platforms to build (comma-separated)"
        required: false
        default: "linux,windows,macos"
        type: string

env:
  PLATFORMS: ${{ inputs.platforms || 'linux,windows,macos' }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  set_version:
    name: Set Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve platforms
        id: platforms
        run: |
          PLATFORMS="${{ inputs.platforms || env.PLATFORMS }}"
          echo "Resolved platforms: $PLATFORMS"
          echo "platforms=$PLATFORMS" >> $GITHUB_OUTPUT
      - name: Compute version
        id: version
        run: |
          CURRENT=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            IFS='.' read -r -a v <<< "$CURRENT"
            v[2]=$((v[2] + 1))
            VERSION="${v[0]}.${v[1]}.${v[2]}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV

  build_linux:
    name: Build Linux
    needs: set_version
    if: contains(needs.set_version.outputs.platforms, 'linux')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Set Version
        run: |
          VERSION=${{ needs.set_version.outputs.version }}
          sed -i "s/^version: .*/version: $VERSION+${{ github.run_number }}/" pubspec.yaml
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libfuse2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.x
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package AppImage
        run: |
          mkdir -p dist
          OUTPUT_DIR="${GITHUB_WORKSPACE}/dist" bash packaging/appimage/build-appimage.sh
      - name: Generate checksums
        run: |
          cd dist
          for f in *.AppImage; do
            sha256sum "$f" > "$f.sha256"
          done
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v5
        with:
          name: linux-bundles
          path: dist/*
          retention-days: 7

  build_windows:
    name: Build Windows
    needs: set_version
    if: contains(needs.set_version.outputs.platforms, 'windows')
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set Version
        run: |
          VERSION=${{ needs.set_version.outputs.version }}
          sed -i "s/^version: .*/version: $VERSION+${{ github.run_number }}/" pubspec.yaml
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.x
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Portable ZIP
        shell: bash
        run: |
          mkdir -p dist
          cd build/windows/x64/runner/Release
          WS="$(echo $GITHUB_WORKSPACE | sed 's|\\|/|g')"
          7z a -tzip "$WS/dist/streamer-co-pilot-windows-x64-portable.zip" *
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Installer
        shell: pwsh
        run: |
          .\scripts\packaging\build_windows_installer.ps1 -OutputDir "dist"
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: windows-bundles
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 7

  build_macos:
    name: Build macOS
    needs: set_version
    if: contains(needs.set_version.outputs.platforms, 'macos')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set Version
        run: |
          VERSION=${{ needs.set_version.outputs.version }}
          sed -i "" "s/^version: .*/version: $VERSION+${{ github.run_number }}/" pubspec.yaml
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.x
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
        env:
          MACOSX_DEPLOYMENT_TARGET: 11.0
      - name: Package macOS ZIP
        run: |
          mkdir -p dist
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/dist/streamer-co-pilot-macos-x64.zip" *.app
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v5
        with:
          name: macos-bundles
          path: dist/*.zip
          retention-days: 7

  create_release:
    name: Create GitHub Release
    needs: [set_version, build_linux, build_windows, build_macos]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.build_linux.result == 'success' &&
      needs.build_windows.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download all artifacts
        uses: actions/download-artifact@v5
      - name: Organize artifacts
        run: |
          mkdir -p release-assets
          for d in linux-bundles windows-bundles macos-bundles; do
            [ -d "$d" ] && cp "$d"/* release-assets/ 2>/dev/null || true
          done
          ls -lh release-assets/
      - name: Verify required assets
        env:
          VERSION: ${{ needs.set_version.outputs.version }}
        run: |
          missing=0
          require() {
            local pattern="$1" label="$2"
            if ! compgen -G "release-assets/$pattern" > /dev/null; then
              echo "MISSING: $label ($pattern)"; missing=1
            else
              echo "OK: $label"
            fi
          }
          require "streamer-co-pilot-x86_64.AppImage" "Linux AppImage"
          require "streamer-co-pilot-x86_64.AppImage.sha256" "Linux AppImage checksum"
          require "streamer-co-pilot-windows-x64-portable.zip" "Windows portable ZIP"
          require "StreamerCoPilot-Windows-x64-Setup.exe" "Windows installer"
          if [ "$missing" -ne 0 ]; then
            echo "Refusing to publish a partial release"
            exit 1
          fi
      - name: Generate release notes
        env:
          VERSION: ${{ needs.set_version.outputs.version }}
        run: |
          {
            echo "## Streamer Co-Pilot v${VERSION}"
            echo ""
            echo "### Linux"
            echo "- **AppImage**: \`streamer-co-pilot-x86_64.AppImage\`"
            echo ""
            echo "### Windows"
            echo "- **Installer**: \`StreamerCoPilot-Windows-x64-Setup.exe\`"
            echo "- **Portable ZIP**: \`streamer-co-pilot-windows-x64-portable.zip\`"
            if compgen -G "release-assets/streamer-co-pilot-macos-x64.zip" > /dev/null; then
              echo ""
              echo "### macOS"
              echo "- **ZIP**: \`streamer-co-pilot-macos-x64.zip\`"
            fi
            echo ""
            echo "### Checksums"
            echo "- SHA-256 checksums included for AppImage"
          } > release-notes.md
          cat release-notes.md
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: release-assets/*
          tag: "v${{ needs.set_version.outputs.version }}"
          name: "Streamer Co-Pilot v${{ needs.set_version.outputs.version }}"
          artifactErrorsFailBuild: true
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
          bodyFile: release-notes.md
          token: ${{ secrets.GITHUB_TOKEN }}
