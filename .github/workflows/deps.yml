name: Dependencies
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check pubspec.yaml
        run: |
          echo "=== pubspec.yaml ==="
          head -30 pubspec.yaml
          echo ""
          echo "=== dev_dependencies ==="
          grep -A 20 "dev_dependencies:" pubspec.yaml || true
